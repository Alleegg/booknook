<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook - Корзина</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="logo">BookNook</a>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="cart.html" class="active">Корзина</a></li>
                </ul>
                <button class="theme-toggle" id="themeToggle">Темная тема</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="cart">
            <h1>Корзина</h1>
            
            <div class="cart-container">
                <div class="cart-items" id="cartItems">
                    <!--добавлены товары js-->
                </div>
                
                <div class="cart-summary">
                    <h3>Итого:</h3>
                    <div class="cart-total" id="cartTotal">0 ₽</div>
                    <button class="btn btn-primary" id="checkoutBtn">Оформить заказ</button>
                    <button class="btn btn-secondary" id="clearCartBtn">Очистить корзину</button>
                </div>
            </div>

            <div id="emptyCartMessage" class="empty-cart">
                <p>Ваша корзина пуста</p>
                <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
            </div>
        </section>
    </main>

    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Оформление заказа</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Адрес доставки:</label>
                    <textarea id="address" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Подтвердить заказ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
