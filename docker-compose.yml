services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booknook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booknook}
      POSTGRES_DB: ${POSTGRES_DB:-booknook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - booknook_pgdata:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknook -d booknook"]
      interval: 3s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://booknook:booknook@db:5432/booknook}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  booknook_pgdata:
